events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 20M;

    # ---- Backend Django API ----
    upstream backend_upstream {
        server backend:8000;
    }

    # ---- Frontend Next.js (web) ----
    upstream frontend_upstream {
        server frontend:3000;
    }

    # ---- Back-office Next.js ----
    upstream backoffice_upstream {
        server backoffice:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # API Backend Django
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Django
        location /admin/ {
            proxy_pass http://backend_upstream/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fichiers statiques Django (servis directement par Nginx)
        location /static/ {
            alias /app/staticfiles/;
        }

        # Back-office (Guy/Cedric)
        location /backoffice/ {
            proxy_pass http://backoffice_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend web (par défaut, tout le reste)
        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}