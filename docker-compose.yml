services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecotisac_db
    restart: always
    environment:
      POSTGRES_DB: ecotisac
      POSTGRES_USER: ecotisac_user
      POSTGRES_PASSWORD: ecotisac_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotisac_user -d ecotisac"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecotisac_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ecotisac_backend
    restart: always
    environment:
      POSTGRES_DB: ecotisac
      POSTGRES_USER: ecotisac_user
      POSTGRES_PASSWORD: ecotisac_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build: ./backend
    container_name: ecotisac_celery
    restart: always
    entrypoint: ["./entrypoint-celery.sh"]
    environment:
      POSTGRES_DB: ecotisac
      POSTGRES_USER: ecotisac_user
      POSTGRES_PASSWORD: ecotisac_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ecotisac_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backoffice:
    build: ./backoffice
    container_name: ecotisac_backoffice
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: ecotisac_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend
      - backoffice

volumes:
  postgres_data:
  redis_data:
  static_data: